<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Canlı Pano Kontrol Merkezi</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root { 
      --primary: #4f46e5; 
      --primary-hover: #4338ca; 
      --bg-color: #f3f4f6; 
      --card-bg: #ffffff; 
      --text-main: #1f2937; 
      --text-muted: #6b7280; 
    }
    
    body { 
      font-family: 'Inter', sans-serif; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      min-height: 100vh; 
      background: linear-gradient(135deg, #e0e7ff 0%, #f3f4f6 100%); 
      margin: 0; 
      padding: 20px; 
      box-sizing: border-box; 
    }
    
    .main-wrapper { 
      display: flex; 
      gap: 30px; 
      width: 100%; 
      max-width: 900px; 
      flex-wrap: wrap; 
    }
    
    .card { 
      background: var(--card-bg); 
      padding: 40px; 
      border-radius: 24px; 
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08); 
      flex: 1; 
      min-width: 280px; /* Mobilde taşmaması için 300'den 280'e çekildi */
      text-align: center; 
      display: flex; 
      flex-direction: column;
      box-sizing: border-box;
    }
    
    h2 { margin: 0 0 8px 0; color: var(--text-main); font-weight: 800; font-size: 24px; }
    p.subtitle { color: var(--text-muted); margin: 0 0 30px 0; font-size: 14px; }
    
    .upload-area { 
      border: 2px dashed #cbd5e1; 
      border-radius: 16px; 
      padding: 40px 20px; 
      cursor: pointer; 
      background: #f8fafc; 
      position: relative; 
      margin-bottom: 24px; 
      transition: all 0.3s; 
    }
    .upload-area:hover { border-color: var(--primary); background: #eef2ff; }
    .upload-icon { width: 48px; height: 48px; fill: #9ca3af; margin-bottom: 12px; }
    .upload-text { color: var(--text-main); font-weight: 600; font-size: 15px; }
    .upload-subtext { color: var(--text-muted); font-size: 12px; }
    
    input[type="file"] { position: absolute; width: 100%; height: 100%; top: 0; left: 0; opacity: 0; cursor: pointer; }
    
    #preview-container { display: none; margin-bottom: 20px; }
    #preview { max-width: 100%; max-height: 180px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
    
    .btn { 
      color: white; 
      border: none; 
      padding: 16px 24px; 
      border-radius: 12px; 
      cursor: pointer; 
      font-size: 16px; 
      font-weight: 600; 
      width: 100%; 
      box-shadow: 0 10px 20px rgba(0,0,0,0.15); 
      transition: all 0.2s ease; 
      font-family: 'Inter', sans-serif; 
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 15px 25px rgba(0,0,0,0.2); }
    .btn:disabled { background: #9ca3af !important; cursor: not-allowed; transform: none; box-shadow: none; }
    
    .btn-send { background: linear-gradient(135deg, var(--primary), var(--primary-hover)); }
    .btn-stop { background: linear-gradient(135deg, #ef4444, #dc2626); margin-top: auto; }
    .btn-start { background: linear-gradient(135deg, #10b981, #059669); margin-top: auto; display: none; }
    
    .live-screen-box { 
      margin-top: 20px; 
      background: #111827; 
      border-radius: 12px; 
      padding: 10px; 
      height: 200px; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      position: relative; 
      overflow: hidden; 
      box-shadow: inset 0 4px 10px rgba(0,0,0,0.5); 
      margin-bottom: 20px; 
    }
    .live-screen-box::before { content: "Yükleniyor..."; color: #4b5563; position: absolute; font-size: 14px; z-index: 1; }
    #live-screen-img { max-width: 100%; max-height: 100%; z-index: 2; border-radius: 8px; display: none; transition: opacity 0.3s ease; }
    
    .status-dot { 
      display: inline-block; 
      width: 10px; 
      height: 10px; 
      background: #10b981; 
      border-radius: 50%; 
      margin-right: 8px; 
      box-shadow: 0 0 8px #10b981; 
      animation: pulse 2s infinite; 
    }
    .status-dot.offline { background: #ef4444; box-shadow: 0 0 8px #ef4444; animation: none; }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

    /* ========================================= */
    /* 📱 MOBİL UYUM (Medya Sorguları)           */
    /* ========================================= */
    @media (max-width: 768px) {
      body {
        padding: 15px; /* Mobilde kenar boşluklarını daralt */
        align-items: flex-start; /* Mobilde ortalamak yerine yukarıdan başlat */
      }
      
      .main-wrapper {
        gap: 15px; /* Kartlar arası boşluğu azalt */
      }
      
      .card {
        padding: 25px 20px; /* İç boşlukları mobilde daraltarak yer kazandır */
        min-width: 100%; /* Tam genişlik kaplamasını sağla */
        border-radius: 20px;
      }
      
      h2 {
        font-size: 20px; /* Başlıkları küçült */
      }
      
      p.subtitle {
        font-size: 13px;
        margin-bottom: 20px;
      }
      
      .upload-area {
        padding: 30px 15px;
        margin-bottom: 20px;
      }
      
      .upload-icon {
        width: 40px;
        height: 40px;
      }
      
      .upload-text {
        font-size: 14px;
      }
      
      .btn {
        padding: 14px 20px;
        font-size: 15px;
      }
      
      .live-screen-box {
        height: 160px; /* Canlı önizleme kutusunu mobilde biraz daralt */
      }
    }
  </style>
</head>
<body>

  <div class="main-wrapper">
    <div class="card">
      <h2>Yayın Merkezi</h2>
      <p class="subtitle">Seçilen görsel anında tüm ekranlara iletilecek.</p>
      
      <div class="upload-area">
        <svg class="upload-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.36 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/>
        </svg>
        <div class="upload-text" id="uploadText">Görsel Seçmek İçin Tıkla</div>
        <div class="upload-subtext" id="uploadSubtext">veya sürükleyip bırak (Max 5MB)</div>
        <input type="file" id="imageInput" accept="image/png, image/jpeg, image/jpg, image/gif" onchange="resmiOnizle()" />
      </div>

      <div id="preview-container">
        <img id="preview" alt="Önizleme" />
      </div>
      
      <button onclick="resmiGonder()" class="btn btn-send" id="sendBtn">Yeni Resmi Yayınla 🚀</button>
    </div>

    <div class="card">
      <h2><span class="status-dot" id="statusDot"></span><span id="statusTitle">Canlı Ekran</span></h2>
      <p class="subtitle" id="last-update-text">Şu an ekranda bu görsel var.</p>
      
      <div class="live-screen-box">
        <img id="live-screen-img" alt="Canlı Ekran" />
      </div>

      <button onclick="yayinDurumunuDegistir(false)" class="btn btn-stop" id="stopBtn">🛑 Yayını Herkesten Gizle (Kapat)</button>
      <button onclick="yayinDurumunuDegistir(true)" class="btn btn-start" id="startBtn">✅ Resmi Yeniden Göster (Aç)</button>
    </div>
  </div>

  <script>
    const firebaseUrl = "https://ekranpanosu-da617-default-rtdb.firebaseio.com/current_image.json";

    // Panel açıldığında veritabanındaki son durumu ÇEK
    window.addEventListener('DOMContentLoaded', () => {
      fetch(firebaseUrl + "?t=" + new Date().getTime())
        .then(res => res.json())
        .then(data => {
          if (data && data.imageUrl) {
            document.getElementById("live-screen-img").src = data.imageUrl;
            document.getElementById("live-screen-img").style.display = "block";
            arayuzuGuncelle(data.isActive, data.time);
          }
        })
        .catch(err => console.error("Firebase bağlantı hatası", err));
    });

    // Butonları ve metinleri duruma göre değiştiren yardımcı fonksiyon
    function arayuzuGuncelle(isActive, time) {
      const isOnline = (isActive !== false); // Tanımsızsa da true kabul et
      
      document.getElementById("stopBtn").style.display = isOnline ? "block" : "none";
      document.getElementById("startBtn").style.display = isOnline ? "none" : "block";
      
      const dot = document.getElementById("statusDot");
      const title = document.getElementById("statusTitle");
      
      if (isOnline) {
        dot.className = "status-dot";
        title.innerText = "Canlı Ekran (Aktif)";
        document.getElementById("live-screen-img").style.opacity = "1";
      } else {
        dot.className = "status-dot offline";
        title.innerText = "Yayın Kapalı";
        document.getElementById("live-screen-img").style.opacity = "0.3"; // Gizliyken resmi soluk göster
      }

      if (time) {
        const tarih = new Date(time);
        document.getElementById("last-update-text").innerText = "Son işlem: " + tarih.toLocaleTimeString();
      }
    }

    // Yayını Aç/Kapat Butonlarının Görevi
    function yayinDurumunuDegistir(durum) {
      const yeniZaman = Date.now();
      
      fetch(firebaseUrl, {
        method: "PATCH", 
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ isActive: durum, time: yeniZaman })
      })
      .then(response => {
        if (response.ok) {
          arayuzuGuncelle(durum, yeniZaman);
        }
      });
    }

    function resmiOnizle() {
      const fileInput = document.getElementById("imageInput");
      const previewContainer = document.getElementById("preview-container");
      
      if (fileInput.files && fileInput.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
          document.getElementById("preview").src = e.target.result;
          previewContainer.style.display = "block";
          document.getElementById("uploadText").innerText = "Farklı bir görsel seç";
          document.getElementById("uploadSubtext").innerText = fileInput.files[0].name;
        }
        reader.readAsDataURL(fileInput.files[0]);
      }
    }

    function resmiGonder() {
      const fileInput = document.getElementById("imageInput");
      const sendBtn = document.getElementById("sendBtn");

      if (fileInput.files.length === 0) {
        alert("Lütfen önce bir resim seçin!");
        return;
      }
      
      sendBtn.innerText = "Gönderiliyor... ⏳";
      sendBtn.disabled = true;

      const reader = new FileReader();
      reader.onload = function(e) {
        const base64Image = e.target.result;
        const suAnkiZaman = Date.now();
        
        fetch(firebaseUrl, {
          method: "PUT", 
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            imageUrl: base64Image,
            time: suAnkiZaman,
            isActive: true 
          })
        })
        .then(response => {
          if (response.ok) {
            document.getElementById("live-screen-img").src = base64Image;
            document.getElementById("live-screen-img").style.display = "block";
            
            arayuzuGuncelle(true, suAnkiZaman);
            
            fileInput.value = "";
            document.getElementById("preview-container").style.display = "none";
            document.getElementById("uploadText").innerText = "Görsel Seçmek İçin Tıkla";
          }
        })
        .finally(() => {
          sendBtn.innerText = "Yeni Resmi Yayınla 🚀";
          sendBtn.disabled = false;
        });
      };
      reader.readAsDataURL(fileInput.files[0]);
    }
  </script>
</body>
</html>
